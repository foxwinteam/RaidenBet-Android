plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.raidenbet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.raidenbet.app"
        minSdk 23          // از اندروید ۶ به بالا اجرا می‌شود
        targetSdk 34
        versionCode 1      // هر بار که اپ را آپدیت کردید این عدد را یکی اضافه کنید
        versionName "1.0"  // شماره نسخه که کاربر می‌بیند
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
